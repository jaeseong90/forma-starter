<div class="forma-popup-page">
    <div id="search-area" style="margin-bottom: 8px;"></div>
    <div id="grid-area"></div>
</div>
<script>
(function() {
    const modal = FormaModal.current();
    const param = FormaModal.getParam() || {};

    const searchForm = new FormaForm('#search-area', {
        search: true,
        elements: [
            { field: 'keyword', label: '검색어', widget: 'text', placeholder: '부서코드 / 부서명', maxLength: 100 }
        ],
        onEnter: function() { doSearch(); }
    });

    const grid = new FormaGrid('#grid-area', {
        sortable: true,
        columns: [
            { field: 'deptCode', label: '부서코드', width: 100 },
            { field: 'deptName', label: '부서명', width: 220 },
            { field: 'useYn', label: '사용', width: 50, align: 'center' }
        ],
        onRowDblClick: function(row) {
            if (modal) modal.ok({ deptCode: row.deptCode, deptName: row.deptName });
        }
    });

    if (param.keyword) searchForm.setField('keyword', param.keyword);

    function doSearch() {
        platform.post('/frm_dept/selectDeptTree', searchForm.getData(), new Callback(function(r) {
            if (r.resultCode === RESULT_CODE.OK) grid.setData(r.resultData);
        }));
    }

    doSearch();
})();
</script>
