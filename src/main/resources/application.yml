server:
  port: 18080

spring:
  profiles:
    active: local
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          no-cache: true
    locale: ko_KR

server.servlet.encoding:
  charset: UTF-8
  force: true
  force-response: true

forma:
  file:
    upload-path: ${FORMA_UPLOAD_PATH:./uploads}
    # 다운로드 위임 (nginx X-Accel-Redirect). 기본 OFF — 로컬은 Spring Resource 로 직접 서빙.
    # 운영 profile(prod)에서 true 로 켜고, nginx 에 internal location 을 추가할 것.
    xaccel:
      enabled: ${FORMA_FILE_XACCEL:false}
      internal-location: ${FORMA_FILE_XACCEL_LOCATION:/internal-files/}
  claude:
    api-key: ${FORMA_CLAUDE_API_KEY:}
  openai:
    api-key: ${FORMA_OPENAI_API_KEY:}
  primary:
    mapper:
      directory: classpath:mapper/**/*.xml
  jwt:
    secret: ${FORMA_JWT_SECRET:formaDefaultSecretKeyForDevelopmentOnly1234567890abcdef}
    valid-seconds: ${FORMA_JWT_VALID_SECONDS:2592000}
  security:
    # 최초 기동 시 admin.user_pw 가 NULL 이면 BCrypt(initial-admin-pw) 로 채움 (InitialAdminBootstrapRunner).
    # 이미 비밀번호가 설정돼 있으면 매 기동마다 호출돼도 아무 일도 안 한다.
    initial-admin-pw: ${FORMA_INITIAL_ADMIN_PW:admin1!}
    # 1회성 운영 도구: 기동 시 전체 사용자 비밀번호를 reset-all-passwords-value 값(BCrypt)로 초기화.
    # 사용 후 반드시 false 로 되돌릴 것 (PasswordBootstrapRunner).
    reset-all-passwords: ${FORMA_RESET_ALL_PASSWORDS:false}
    reset-all-passwords-value: ${FORMA_RESET_ALL_PASSWORDS_VALUE:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.forma: DEBUG

# OpenAPI / Swagger UI
# 기본 ON (개발 편의). 운영(prod)에선 application-prod.yml.example 의 설정으로 OFF.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
