# DEMO_CUSTOMER — 거래처-담당자 (split-detail)
# FORMA 방식 A(YAML 1장) 학습용 샘플. 실 서비스 화면 아님 (실 화면은 pages/customer/CST010.html).
# 타겟: tb_customer(마스터) + tb_customer_contact(디테일).

screen:
  id: DEMO_CUSTOMER
  name: 거래처-담당자 (학습샘플)
  module: demo/customer
  type: split-detail
  description: 좌측 거래처 선택 → 우측 담당자 목록 자동 로드. 마스터-디테일 YAML 모델 학습용.

auth:
  search: true
  new: true
  save: true
  delete: true
  init: true

search:
  - field: cust_nm
    label: 거래처명
    widget: text
    placeholder: 거래처명 일부
  - field: cust_type
    label: 유형
    widget: combo
    code: CUST_TYPE
  - field: use_yn
    label: 사용여부
    widget: combo
    default: Y
    options:
      - { value: Y, label: 사용 }
      - { value: N, label: 미사용 }

grids:
  grid1:                            # 좌측: 거래처 마스터
    checkable: true
    rowNum: true
    columns:
      - { field: cust_cd,   label: 거래처코드, width: 100, required: true, frozen: true }
      - { field: cust_nm,   label: 거래처명,   width: 200, required: true }
      - { field: cust_type, label: 유형,       width: 90,  editor: select, code: CUST_TYPE }
      - { field: biz_no,    label: 사업자번호, width: 120 }
      - { field: ceo_nm,    label: 대표자,     width: 90 }
      - { field: tel,       label: 전화,       width: 120 }
      - { field: buy_yn,    label: 매입,       width: 60, editor: check, align: center }
      - { field: sell_yn,   label: 매출,       width: 60, editor: check, align: center }
      - { field: use_yn,    label: 사용,       width: 60, editor: check, align: center }

  grid2:                            # 우측: 담당자 디테일 (거래처 클릭 시 자동 로드)
    editable: true
    checkable: true
    rowNum: true
    columns:
      - { field: seq,         label: 순번,     width: 60,  type: number, readOnly: true }
      - { field: contact_nm,  label: 담당자,   width: 100, required: true }
      - { field: dept_nm,     label: 부서,     width: 100 }
      - { field: position,    label: 직책,     width: 100 }
      - { field: tel,         label: 전화,     width: 120 }
      - { field: mobile,      label: 휴대전화, width: 120 }
      - { field: email,       label: 이메일,   width: 180 }
      - { field: is_primary,  label: 대표,     width: 60,  editor: check, align: center }

layout:
  type: split-h
  splitWidth: 700

sql:
  tables:
    - { name: tb_customer,         alias: c }
    - { name: tb_customer_contact, alias: cc }
  selectGrid1:
    table: tb_customer c
    columns: c.cust_cd, c.cust_nm, c.cust_type, c.biz_no, c.ceo_nm, c.tel, c.buy_yn, c.sell_yn, c.use_yn
    orderBy: c.cust_nm
  selectGrid2:                      # 마스터 키(cust_cd)로 필터 — split-detail 필수
    table: tb_customer_contact cc
    columns: cc.cust_cd, cc.seq, cc.contact_nm, cc.dept_nm, cc.position, cc.tel, cc.mobile, cc.email, cc.is_primary
    where: cc.cust_cd = #{cust_cd}
    orderBy: cc.seq
  insertGrid2:
    table: tb_customer_contact
  updateGrid2:
    table: tb_customer_contact
    where: cust_cd = #{cust_cd} AND seq = #{seq}
  deleteGrid2:
    table: tb_customer_contact
    where: cust_cd = #{cust_cd} AND seq = #{seq}
