# FORMA Starter — 로컬 부트스트랩용 PostgreSQL
#
# 사용법:
#   docker compose up -d     # 15432 포트로 PostgreSQL 기동 (빈 DB)
#   docker compose down       # 컨테이너 정리 (볼륨 유지)
#   docker compose down -v    # 데이터까지 초기화
#
# 스키마/시드는 **Flyway** 가 앱 기동 시 자동 적용한다 (src/main/resources/db/migration/V*__*.sql).
# 따라서 본 docker-compose 는 빈 PostgreSQL 만 제공하면 되고, /docker-entrypoint-initdb.d 마운트는
# 더 이상 필요하지 않다. 운영 DB 의 경우 Flyway 가 동일하게 동작한다.

services:
  postgres:
    image: postgres:16-alpine
    container_name: forma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "15432:5432"
    volumes:
      - forma-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  forma-pgdata:
