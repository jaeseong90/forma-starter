plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.saleson'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

dependencies {
    // Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Actuator (health check)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // YAML parsing
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    // HTTP Client (Claude API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Excel / Word (DOCX)
    implementation 'org.apache.poi:poi:4.1.0'
    implementation 'org.apache.poi:poi-ooxml:4.1.0'

    // PDF (OpenPDF — LGPL)
    implementation 'com.github.librepdf:openpdf:1.3.34'

    // DB
    runtimeOnly 'org.postgresql:postgresql'

    // DevTools (자동 재시작 + 정적 리소스 즉시 반영)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('design') {
        include 'screens/*.yml'
        into 'design'
    }
}

test { useJUnitPlatform() }

// 공용 SQL 마이그레이션 실행 헬퍼 — 운영 DB(10.0.1.163)에 한 번에 여러 statement 실행.
//   사용: ./gradlew runSqlMigration -Pfile=src/main/resources/schema/migrations/<파일>.sql
tasks.register('runSqlMigration') {
    doLast {
        def filePath = project.findProperty('file') ?: 'src/main/resources/schema/migrations/20260422-add-table-column-comments.sql'
        def jdbcUrl = 'jdbc:postgresql://10.0.1.163:15432/salesondb'
        def dbUser = 'saleson'
        def dbPass = 'saleson1!'
        def urls = configurations.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, this.class.classLoader)
        def driver = loader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
        def props = new Properties()
        props.setProperty('user', dbUser)
        props.setProperty('password', dbPass)
        def sqlText = new File(filePath).getText('UTF-8')
        // 단순 split: 문장 안에 세미콜론 없음을 가정. COMMENT/ALTER 는 안전.
        // 각 statement 내부의 라인 주석을 먼저 걷어내고, 세미콜론으로 split.
        def noComments = sqlText.readLines().findAll { !it.trim().startsWith('--') }.join('\n')
        def stmts = noComments.split('(?m);\\s*$').collect { it.trim() }.findAll { it }
        def conn = driver.connect(jdbcUrl, props)
        def ok = 0, fail = 0
        try {
            def st = conn.createStatement()
            stmts.each { s ->
                try {
                    st.execute(s)
                    ok++
                } catch (Exception e) {
                    fail++
                    println "FAIL: ${s.take(80)}... -> ${e.message}"
                }
            }
            st.close()
            println "Migration applied. ok=${ok}, fail=${fail}"
        } finally {
            conn.close()
        }
    }
}

// 일회용 진단 태스크: order_type 제거 검증
