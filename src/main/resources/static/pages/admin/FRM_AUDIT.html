<div class="forma-page">
    <div class="forma-page-header">
        <h1 class="forma-page-title" id="title-FRM_AUDIT"></h1>
        <div id="toolbar-FRM_AUDIT"></div>
    </div>
    <div class="forma-content">
        <div id="tab-FRM_AUDIT"></div>
    </div>
</div>
<script>
(async function() {
    const PGM = 'FRM_AUDIT';
    const S = PGM;
    const listener = platform.initListener(PGM);
    const ctx = { activeTab: 'audit-tab-' + S, traceLoaded: false };

    await platform.startPage(PGM, listener);

    ctx.tab = new FormaTab('#tab-' + S, {
        tabs: [
            { id: 'audit-tab-' + S, label: '감사로그' },
            { id: 'trace-tab-' + S, label: '서비스트레이스' }
        ],
        listener: listener,
        onTabChange: function(tabId) {
            ctx.activeTab = tabId;
            if (tabId === 'trace-tab-' + S && !ctx.traceLoaded) {
                loadTrace();
            }
        }
    });

    // --- Audit Log Tab ---
    const auditPanel = ctx.tab.getContentEl('audit-tab-' + S);

    const searchDiv = document.createElement('div');
    searchDiv.id = 'audit-search-' + S;
    auditPanel.appendChild(searchDiv);

    const gridDiv = document.createElement('div');
    gridDiv.id = 'audit-grid-' + S;
    auditPanel.appendChild(gridDiv);

    const detailDiv = document.createElement('div');
    detailDiv.id = 'audit-detail-' + S;
    detailDiv.style.cssText = 'display:none; margin-top:10px;';
    detailDiv.innerHTML =
        '<div style="display:flex; gap:10px;">' +
            '<div style="flex:1">' +
                '<label style="font-weight:bold; display:block; margin-bottom:4px;">변경 전 (Before)</label>' +
                '<textarea id="audit-before-' + S + '" readonly style="width:100%; height:150px; font-family:monospace; font-size:12px; resize:vertical;"></textarea>' +
            '</div>' +
            '<div style="flex:1">' +
                '<label style="font-weight:bold; display:block; margin-bottom:4px;">변경 후 (After)</label>' +
                '<textarea id="audit-after-' + S + '" readonly style="width:100%; height:150px; font-family:monospace; font-size:12px; resize:vertical;"></textarea>' +
            '</div>' +
        '</div>';
    auditPanel.appendChild(detailDiv);

    ctx.auditSearchForm = new FormaForm('#audit-search-' + S, {
        search: true,
        elements: [
            { field: 'audit_dt', label: '감사일자', widget: 'dateRange', default: 'THIS_MONTH' },
            { field: 'pgm_id', label: '프로그램ID', placeholder: '프로그램ID' },
            { field: 'user_id', label: '사용자ID', placeholder: '사용자ID' },
            { field: 'action', label: '액션', widget: 'combo', options: [
                { value: '', label: '전체' },
                { value: 'INSERT', label: 'INSERT' },
                { value: 'UPDATE', label: 'UPDATE' },
                { value: 'DELETE', label: 'DELETE' }
            ]}
        ]
    });

    ctx.auditGrid = new FormaGrid('#audit-grid-' + S, {
        columns: [
            { field: 'auditSeq', label: '순번', width: 70, align: 'center' },
            { field: 'auditDt', label: '감사일시', width: 150 },
            { field: 'pgmId', label: '프로그램ID', width: 100 },
            { field: 'tableName', label: '테이블', width: 140 },
            { field: 'action', label: '액션', width: 80, align: 'center', renderer: function(val) {
                const colors = { INSERT: '#27ae60', UPDATE: '#2980b9', DELETE: '#e74c3c' };
                const color = colors[val] || '#666';
                return '<span style="color:' + color + '; font-weight:bold;">' + (val || '') + '</span>';
            }},
            { field: 'rowKey', label: 'ROW KEY', width: 140 },
            { field: 'userId', label: '사용자ID', width: 100 },
            { field: 'userIp', label: 'IP', width: 120 }
        ],
        onRowClick: function(row) {
            const detailArea = document.getElementById('audit-detail-' + S);
            detailArea.style.display = 'block';
            document.getElementById('audit-before-' + S).value = row.beforeData ? JSON.stringify(JSON.parse(row.beforeData), null, 2) : '';
            document.getElementById('audit-after-' + S).value = row.afterData ? JSON.stringify(JSON.parse(row.afterData), null, 2) : '';
        },
    });

    // --- Trace Tab ---
    const tracePanel = ctx.tab.getContentEl('trace-tab-' + S);

    const traceGridDiv = document.createElement('div');
    traceGridDiv.id = 'trace-grid-' + S;
    tracePanel.appendChild(traceGridDiv);

    ctx.traceGrid = new FormaGrid('#trace-grid-' + S, {
        columns: [
            { field: 'traceId', label: 'Trace ID', width: 140 },
            { field: 'pgmId', label: '프로그램ID', width: 100 },
            { field: 'type', label: '유형', width: 80 },
            { field: 'name', label: '이름', width: 200 },
            { field: 'detail', label: '상세', width: 250 },
            { field: 'elapsedMs', label: '소요시간(ms)', width: 100, align: 'right', renderer: function(val) {
                const num = Number(val);
                const color = num > 1000 ? '#e74c3c' : (num > 500 ? '#e67e22' : '#333');
                return '<span style="color:' + color + '; font-weight:' + (num > 500 ? 'bold' : 'normal') + ';">' + (val || '0') + '</span>';
            }},
            { field: 'error', label: '에러', width: 200, renderer: function(val) {
                if (!val) return '';
                return '<span style="color:#e74c3c;">' + val + '</span>';
            }},
            { field: 'ts', label: '시간', width: 160, format: 'date' }
        ]
    });

    function loadAuditLog() {
        const param = ctx.auditSearchForm.getData();
        platform.post('/api/admin/auditLog', param, new Callback(function(result) {
            if (result.resultCode === RESULT_CODE.OK) {
                ctx.auditGrid.setData(result.resultData);
                const detailArea = document.getElementById('audit-detail-' + S);
                if (detailArea) detailArea.style.display = 'none';
            }
        }));
    }

    function loadTrace() {
        platform.get('/api/trace/recent?count=200', new Callback(function(result) {
            if (result.resultCode === RESULT_CODE.OK) {
                ctx.traceGrid.setData(result.resultData);
                ctx.traceLoaded = true;
            }
        }));
    }

    listener.button.search.click = function() {
        if (ctx.activeTab === 'audit-tab-' + S) {
            loadAuditLog();
        } else {
            loadTrace();
        }
    };

    listener.button.init.click = function() {
        if (ctx.activeTab === 'audit-tab-' + S) {
            ctx.auditSearchForm.clear();
            ctx.auditGrid.clearData();
            const detailArea = document.getElementById('audit-detail-' + S);
            if (detailArea) detailArea.style.display = 'none';
        } else {
            ctx.traceGrid.clearData();
            ctx.traceLoaded = false;
        }
    };

    listener.button.search.click();
    listener.initializedPgm = true;
})();
</script>
