name: 기능 제안
description: 프레임워크에 추가/개선이 필요한 사항
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        FORMA Starter 는 단방향(starter → 프로젝트) 배포 정책이라, 도메인 특수 기능은 본 저장소가 아닌 각 프로젝트에서 다룬다. 본 양식은 **프레임워크 자산** 개선 제안용.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나
      description: 어떤 상황에서 불편하거나 막혔는지
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 변경
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 다른 대안
      description: 이미 가능한 우회 방법이 있다면
  - type: textarea
    id: impact
    attributes:
      label: 다운스트림 영향
      placeholder: "패키지/스키마/SPI/환경변수 변경 여부, 마이그레이션 가이드 필요 여부"
