}

// 일회용 마이그레이션 태스크: tb_file 에 ref_id2, ref_id3 컬럼 추가 (idempotent)
tasks.register('migrateFileAddRefIds') {
    doLast {
        def jdbcUrl = 'jdbc:postgresql://10.0.1.163:15432/salesondb'
        def dbUser = 'saleson'
        def dbPass = 'saleson1!'
        def urls = configurations.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, this.class.classLoader)
        Class.forName('org.postgresql.Driver', true, loader)
        def driver = loader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
        def props = new Properties()
        props.setProperty('user', dbUser)
        props.setProperty('password', dbPass)
        def conn = driver.connect(jdbcUrl, props)
        try {
            def stmt = conn.createStatement()
            ['ALTER TABLE tb_file ADD COLUMN IF NOT EXISTS ref_id2 VARCHAR(50)',
             'ALTER TABLE tb_file ADD COLUMN IF NOT EXISTS ref_id3 VARCHAR(50)',
             // 기존 CARD 데이터 재매핑: ref_id 'custCd_seq' → ref_id=custCd, ref_id2=seq
             """UPDATE tb_file
                   SET ref_id  = SPLIT_PART(ref_id, '_', 1),
                       ref_id2 = SPLIT_PART(ref_id, '_', 2)
                 WHERE ref_type = 'CARD'
                   AND ref_id LIKE '%\\_%' ESCAPE '\\'
                   AND ref_id2 IS NULL"""].each { s ->
                println "> ${s}"
                stmt.execute(s)
            }
            stmt.close()
            println 'Migration applied.'
        } finally {
            conn.close()
        }
    }
}
