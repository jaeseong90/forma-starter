// 일회용 마이그레이션 태스크: tb_business.owner_id 백필 (owner_nm → tb_user.user_nm 매칭)
tasks.register('backfillBusinessOwnerId') {
    doLast {
        def jdbcUrl = 'jdbc:postgresql://10.0.1.163:15432/salesondb'
        def dbUser = 'saleson'
        def dbPass = 'saleson1!'
        def urls = configurations.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, this.class.classLoader)
        def driver = loader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
        def props = new Properties()
        props.setProperty('user', dbUser)
        props.setProperty('password', dbPass)
        def conn = driver.connect(jdbcUrl, props)
        try {
            def st = conn.createStatement()
            def rs = st.executeQuery("""
                SELECT b.biz_no, b.biz_nm, b.owner_nm,
                       (SELECT COUNT(*) FROM tb_user u WHERE u.user_nm = b.owner_nm) AS cnt
                  FROM tb_business b
                 WHERE b.owner_id IS NULL
                   AND b.owner_nm IS NOT NULL
                   AND b.owner_nm <> ''
            """)
            def uniq = [], zero = [], multi = []
            while (rs.next()) {
                def row = [bizNo: rs.getString(1), bizNm: rs.getString(2), ownerNm: rs.getString(3), cnt: rs.getInt(4)]
                if (row.cnt == 1) uniq << row
                else if (row.cnt == 0) zero << row
                else multi << row
            }
            rs.close()
            println "=== 진단 ==="
            println "owner_id NULL & owner_nm 존재: ${uniq.size() + zero.size() + multi.size()} 건"
            println "  - 유일매칭: ${uniq.size()} 건 (업데이트 대상)"
            println "  - 매칭없음: ${zero.size()} 건"
            println "  - 동명이인: ${multi.size()} 건"
            if (zero)  println "  매칭없음 상세:"  + zero.collect  { "\n    ${it.bizNo} ${it.bizNm} [${it.ownerNm}]" }.join('')
            if (multi) println "  동명이인 상세:" + multi.collect { "\n    ${it.bizNo} ${it.bizNm} [${it.ownerNm}] ${it.cnt}명" }.join('')

            def upd = st.executeUpdate("""
                UPDATE tb_business b
                   SET owner_id = (SELECT u.user_id FROM tb_user u WHERE u.user_nm = b.owner_nm)
                 WHERE b.owner_id IS NULL
                   AND b.owner_nm IS NOT NULL
                   AND b.owner_nm <> ''
                   AND (SELECT COUNT(*) FROM tb_user u2 WHERE u2.user_nm = b.owner_nm) = 1
            """)
            println "=== 적용 ==="
            println "업데이트: ${upd} 건"
            st.close()
        } finally {
            conn.close()
        }
    }
}

// 일회용 진단 태스크: 개발팀 소속 사용자 중 USER 역할 매핑 미리보기 (UTF-8 파일로 출력)
tasks.register('previewDevTeamUserRoleCleanup') {
    doLast {
        def jdbcUrl = 'jdbc:postgresql://10.0.1.163:15432/salesondb'
        def urls = configurations.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, this.class.classLoader)
        def driver = loader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
        def props = new Properties(); props.setProperty('user', 'saleson'); props.setProperty('password', 'saleson1!')
        def conn = driver.connect(jdbcUrl, props)
        def outFile = new File(project.buildDir, 'preview-dev-user-role.txt')
        outFile.parentFile.mkdirs()
        def out = new PrintWriter(outFile.newWriter('UTF-8'))
        try {
            def st = conn.createStatement()
            def rsD = st.executeQuery("SELECT dept_code, dept_name FROM tb_dept WHERE dept_name LIKE '%개발%'")
            def depts = []
            while (rsD.next()) depts << [code: rsD.getString(1), name: rsD.getString(2)]
            rsD.close()
            out.println "=== 개발 포함 부서 ==="
            depts.each { out.println "  ${it.code} ${it.name}" }
            if (depts.isEmpty()) { out.println "개발 부서를 찾지 못했습니다."; return }

            def deptCodes = depts.collect { "'" + it.code + "'" }.join(',')
            def rs = st.executeQuery("""
                SELECT u.user_id, u.user_nm, d.dept_name, ur.role_cd
                  FROM tb_user u
                  JOIN tb_user_role ur ON u.user_id = ur.user_id
                  LEFT JOIN tb_dept d ON u.dept_code = d.dept_code
                 WHERE u.dept_code IN (${deptCodes})
                   AND ur.role_cd = 'USER'
                 ORDER BY d.dept_name, u.user_id
            """)
            def rows = []
            while (rs.next()) rows << [id: rs.getString(1), nm: rs.getString(2), dept: rs.getString(3), role: rs.getString(4)]
            rs.close()
            out.println "=== 삭제 대상(개발 부서 + USER 역할) ==="
            out.println "총 ${rows.size()} 건"
            rows.each { out.println "  ${(it.id ?: '').padRight(12)} ${(it.nm ?: '').padRight(12)} [${it.dept}] role=${it.role}" }
            st.close()
        } finally {
            out.flush(); out.close()
            conn.close()
        }
        println "Preview written to: ${outFile.absolutePath}"
    }
}

// 일회용: RPT020 주간보고조회 권한을 MANAGER/USER에도 부여 (멱등)
tasks.register('grantRpt020ToAllRoles') {
    doLast {
        def jdbcUrl = 'jdbc:postgresql://10.0.1.163:15432/salesondb'
        def urls = configurations.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
        def loader = new URLClassLoader(urls, this.class.classLoader)
        def driver = loader.loadClass('org.postgresql.Driver').getDeclaredConstructor().newInstance()
        def props = new Properties(); props.setProperty('user', 'saleson'); props.setProperty('password', 'saleson1!')
        def conn = driver.connect(jdbcUrl, props)
        try {
            def st = conn.createStatement()
            def grants = [
                ['MANAGER','RPT020'],
                ['USER','RPT020']
            ]
            def added = 0, existed = 0
            grants.each { g ->
                def rs = st.executeQuery("SELECT 1 FROM tb_role_auth WHERE role_cd='${g[0]}' AND pgm_id='${g[1]}'")
                def hit = rs.next(); rs.close()
                if (hit) { existed++; return }
                st.executeUpdate("INSERT INTO tb_role_auth VALUES ('${g[0]}','${g[1]}','Y','N','N','N','N','N','Y','N','N','N')")
                added++
            }
            println "Role auth — added: ${added}, already existed: ${existed}"
            st.close()
        } finally {
            conn.close()
        }
    }
}

// 일회용 삭제 태스크: 개발 부서(이름에 '개발' 포함) 사용자 USER 역할 매핑 제거
